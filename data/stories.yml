
version: "3.1"

stories:

  # --------------------------------------------------
  # 1. Normal trip planning
  # --------------------------------------------------

  - story: Complete trip planning
    steps:

      - intent: plan_trip
      - action: action_extract_trip_slots
      - action: travel_form
      - active_loop: travel_form

      - slot_was_set:
          - origin: Berlin
          - destination: Tokyo

      - intent: provide_dates
      - action: travel_form
      - slot_was_set:
          - date: 16 May

      - intent: provide_accommodation_type
      - action: travel_form
      - slot_was_set:
          - accommodation_type: eco-hotel

      - intent: provide_budget
      - action: travel_form
      - slot_was_set:
          - budget_max: 100

      - intent: provide_sustainability_preference
      - action: travel_form
      - slot_was_set:
          - sustainability_preference: high

      - active_loop: null

      - action: utter_trip_details_collected
      - action: action_find_travel_options


